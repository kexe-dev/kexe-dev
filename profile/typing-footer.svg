<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 480 50'
    style='background-color: #00000000;'
    width='480px' height='50px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 700;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d0.end'
                    dur='6000ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h246.4 ; m0,25 h246.4 ; m0,25 h480 ; m0,25 h480 ; m0,25 h0' keyTimes='0;0.1369;0.3036;0.4333;0.9333;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#666666' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            You made it to the end, here have a cookie 🍪
        </textPath>
    </text>
</svg>
